<!doctype html>
<html lang="ja" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3efe6" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem("roadmap-theme");
          const theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute("content", theme === "dark" ? "#171915" : "#f3efe6");
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <meta
      name="description"
      content="__PAGE_DESCRIPTION__"
    />
    <link rel="canonical" href="__PAGE_URL__" />
    <link rel="icon" type="image/svg+xml" href="/roadmap/favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:url" content="__PAGE_URL__" />
    <meta property="og:site_name" content="Doctoral Roadmap" />
    <meta property="og:title" content="__PAGE_TITLE__" />
    <meta
      property="og:description"
      content="__PAGE_DESCRIPTION__"
    />
    <meta property="og:image" content="https://aki41105.github.io/roadmap/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="研究と暮らしの節目をつないだ抽象的なロードマップ"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__PAGE_TITLE__" />
    <meta
      name="twitter:description"
      content="__PAGE_DESCRIPTION__"
    />
    <meta name="twitter:image" content="https://aki41105.github.io/roadmap/og.png" />
    <title>__PAGE_TITLE__</title>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
